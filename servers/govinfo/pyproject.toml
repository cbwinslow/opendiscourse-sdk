[project]
name = "govinfo-mcp"
version = "0.1.0"
description = "MCP Server for GovInfo.gov Data Ingestion"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
    "httpx",
    "psycopg2-binary",
    "python-dotenv",
    "click"
]

[project.scripts]
govinfo-mcp = "govinfo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
