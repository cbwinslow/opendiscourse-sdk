name: Auto-Merge Dependabot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI to complete
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const maxAttempts = 60; // 30 minutes (60 * 30 seconds)
            let attempts = 0;
            
            while (attempts < maxAttempts) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha
              });
              
              const allChecks = checks.check_runs;
              const relevantChecks = allChecks.filter(check => 
                check.name !== 'Auto-Merge Dependabot'
              );
              
              if (relevantChecks.length === 0) {
                console.log('No checks found yet, waiting...');
                await new Promise(resolve => setTimeout(resolve, 30000));
                attempts++;
                continue;
              }
              
              const allCompleted = relevantChecks.every(check => 
                check.status === 'completed'
              );
              
              if (!allCompleted) {
                console.log('Checks still running, waiting...');
                await new Promise(resolve => setTimeout(resolve, 30000));
                attempts++;
                continue;
              }
              
              const allPassed = relevantChecks.every(check => 
                check.conclusion === 'success' || check.conclusion === 'skipped'
              );
              
              if (allPassed) {
                console.log('All checks passed!');
                return;
              } else {
                core.setFailed('Some checks failed');
                return;
              }
            }
            
            core.setFailed('Timeout waiting for checks');

      - name: Auto-merge for patch and minor updates
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ This is a **major version update**. Please review carefully before merging.'
            });
