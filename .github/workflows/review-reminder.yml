name: Review Reminder

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Weekdays at 9 AM
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  remind-reviewers:
    runs-on: ubuntu-latest
    steps:
      - name: Find PRs needing review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            const today = new Date();
            
            for (const pr of prs) {
              // Skip draft PRs
              if (pr.draft) continue;
              
              // Get reviews
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              
              // Check if PR has been reviewed
              const hasApproval = reviews.some(review => review.state === 'APPROVED');
              const hasChangesRequested = reviews.some(review => review.state === 'CHANGES_REQUESTED');
              
              // Calculate days since creation
              const createdAt = new Date(pr.created_at);
              const daysSinceCreated = Math.floor((today - createdAt) / (1000 * 60 * 60 * 24));
              
              // Calculate days since last update
              const updatedAt = new Date(pr.updated_at);
              const daysSinceUpdate = Math.floor((today - updatedAt) / (1000 * 60 * 60 * 24));
              
              // Get requested reviewers
              const { data: requestedReviewers } = await github.rest.pulls.listRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              
              const hasRequestedReviewers = requestedReviewers.users.length > 0 || requestedReviewers.teams.length > 0;
              
              // Remind if:
              // 1. PR is older than 2 days and has no reviews
              // 2. PR has requested reviewers but no reviews yet
              // 3. Changes were requested and author has updated but no new review
              
              let shouldRemind = false;
              let reminderMessage = '';
              
              if (!hasApproval && daysSinceCreated >= 2 && reviews.length === 0) {
                shouldRemind = true;
                reminderMessage = `This PR has been open for ${daysSinceCreated} days without any reviews. `;
              } else if (hasRequestedReviewers && !hasApproval && daysSinceUpdate >= 1) {
                shouldRemind = true;
                reminderMessage = `Gentle reminder: this PR is awaiting review from requested reviewers. `;
              } else if (hasChangesRequested && daysSinceUpdate >= 2 && !hasApproval) {
                shouldRemind = true;
                reminderMessage = `Changes were requested and the author has updated the PR. Ready for re-review. `;
              }
              
              if (shouldRemind) {
                const reviewerMentions = requestedReviewers.users.map(u => `@${u.login}`).join(' ');
                const teamMentions = requestedReviewers.teams.map(t => `@${context.repo.owner}/${t.name}`).join(' ');
                
                let comment = `🔔 **Review Reminder**\n\n${reminderMessage}`;
                
                if (reviewerMentions || teamMentions) {
                  comment += `\n\nRequested reviewers: ${reviewerMentions} ${teamMentions}`;
                }
                
                comment += `\n\nPlease review when you have a chance. Thank you! 🙏`;
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: comment
                });
                
                console.log(`Sent review reminder for PR #${pr.number}`);
              }
            }
