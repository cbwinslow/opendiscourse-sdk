name: Sync Task Board
on:
  push:
    paths: ['project_tasks.md']

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - name: Sync table
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN_BOT }}
      run: |
        pip install python-frontmatter pyyaml rich
        python scripts/sync_tasks_to_gh.py
