name: Auto Issue Creator

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  workflow_failure_issues:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install PyGithub requests || echo "Install failed"
      - name: Create failure issue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import os
          from github import Github
          try:
              g = Github(os.environ['GITHUB_TOKEN'])
              repo = g.get_repo('${{ github.repository }}')
              title = '🚨 Workflow Failure: ${{ github.event.workflow_run.name }}'
              body = '''## Workflow Failure
**Run:** ${{ github.event.workflow_run.html_url }}
**Branch:** ${{ github.event.workflow_run.head_branch }}
This issue was automatically created.'''
              existing = list(repo.get_issues(state='open', labels=['workflow-failure']))[:3]
              if not any(title in str(i.title) for i in existing):
                  repo.create_issue(title=title, body=body, labels=['workflow-failure', 'automated'])
                  print('Issue created')
          except Exception as e:
              print(f'Failed: {e}')
          "

  pr_comment_issues:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, 'gh create issue')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install PyGithub || echo "Install failed"
      - name: Create issue from comment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 .github/scripts/create_issue_from_comment.py || echo "Script execution failed"

  scan_repository:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install PyGithub requests || echo "Install failed"
      - name: Scan for errors
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ".github/scripts/scan_repository_errors.py" ]; then
            python3 .github/scripts/scan_repository_errors.py || echo "Scan completed"
          fi
