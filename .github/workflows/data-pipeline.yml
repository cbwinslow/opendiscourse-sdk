name: Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: opendiscourse
          POSTGRES_PASSWORD: opendiscourse
          POSTGRES_DB: opendiscourse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: opendiscourse
      POSTGRES_USER: opendiscourse
      POSTGRES_PASSWORD: opendiscourse
      GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt

      - name: Run data pipeline
        run: python scripts/populate_database.py
