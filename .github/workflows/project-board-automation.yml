name: Project Board Automation

on:
  issues:
    types: [opened, closed, reopened, labeled]
  pull_request:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft]

permissions:
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  auto-add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to project board
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const itemType = context.eventName === 'issues' ? 'Issue' : 'PullRequest';
            const itemNumber = context.eventName === 'issues' ? 
              context.payload.issue.number : 
              context.payload.pull_request.number;
            
            console.log(`Processing ${itemType} #${itemNumber}`);
            
            // This is a placeholder for project board automation
            // GitHub's GraphQL API should be used for full project board integration
            // For now, we'll add labels based on status
            
            if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              
              if (context.payload.action === 'opened') {
                // New issues go to "Backlog"
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: itemNumber,
                  labels: ['status: backlog']
                });
              } else if (context.payload.action === 'closed') {
                // Closed issues
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: itemNumber,
                  name: 'status: in-progress'
                }).catch(() => {});
                
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: itemNumber,
                  labels: ['status: done']
                });
              }
              
              // Handle priority labels
              const labels = issue.labels.map(l => l.name);
              if (labels.includes('bug') && !labels.some(l => l.startsWith('priority:'))) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: itemNumber,
                  labels: ['priority: medium']
                });
              }
            } else if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              
              if (context.payload.action === 'opened' || context.payload.action === 'reopened') {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: itemNumber,
                  labels: ['status: in-review']
                });
              } else if (context.payload.action === 'ready_for_review' && !pr.draft) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: itemNumber,
                  name: 'work-in-progress'
                }).catch(() => {});
                
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: itemNumber,
                  labels: ['status: ready-for-review']
                });
              } else if (context.payload.action === 'converted_to_draft') {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: itemNumber,
                  labels: ['work-in-progress']
                });
              }
            }
