name: Comprehensive Test Suite

on:
  push:
    branches: [ main, develop, fresh-start ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.13'

jobs:
  # ============================================================================
  # Python Unit Tests
  # ============================================================================
  python-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt

    - name: Run Python unit tests with coverage
      run: |
        pytest tests/unit/ \
          --cov=scripts \
          --cov=api \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term \
          --cov-fail-under=80

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: python
        name: codecov-python-${{ matrix.python-version }}

  # ============================================================================
  # Python Integration Tests
  # ============================================================================
  python-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: opendiscourse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt

    - name: Wait for PostgreSQL
      run: |
        timeout 10s bash -c 'until pg_isready -h localhost -p 5432; do sleep 0.5; done'

    - name: Run integration tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: opendiscourse_test
        DB_USER: test_user
        DB_PASSWORD: test_password
        TEST_DATABASE_AVAILABLE: true
      run: |
        pytest tests/integration/ \
          --cov=scripts \
          --cov=api \
          --cov-report=xml \
          --cov-fail-under=70 \
          -m integration

  # ============================================================================
  # JavaScript/TypeScript Tests
  # ============================================================================
  javascript-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: |
        npm ci
        npm install --save-dev @types/jest

    - name: Run JavaScript tests
      working-directory: web
      run: |
        npm test -- --coverage --watchAll=false

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: web/coverage
        flags: javascript
        name: codecov-js

  # ============================================================================
  # End-to-End Tests
  # ============================================================================
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [python-unit-tests, javascript-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt

    - name: Install JavaScript dependencies
      working-directory: web
      run: npm ci

    - name: Build application
      working-directory: web
      run: npm run build

    - name: Run E2E tests
      env:
        SKIP_NETWORK_TESTS: true
        SKIP_INTEGRATION_TESTS: true
      run: |
        pytest tests/e2e/ -v

  # ============================================================================
  # Performance Tests
  # ============================================================================
  performance-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt

    - name: Run performance tests
      run: |
        pytest tests/performance/ \
          -m performance \
          --benchmark-only \
          --benchmark-json=benchmark.json

    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        tool: 'pytest'
        output-file-path: benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true

  # ============================================================================
  # Security Tests
  # ============================================================================
  security-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security linter
      run: |
        bandit -r scripts/ -f json -o bandit-report.json || true

    - name: Run Safety vulnerability scanner
      run: |
        safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # ============================================================================
  # Code Quality Checks
  # ============================================================================
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy

    - name: Check code formatting (Black)
      run: |
        black --check --diff scripts/ api/ tests/

    - name: Check import sorting (isort)
      run: |
        isort --check-only --diff scripts/ api/ tests/

    - name: Run flake8 linter
      run: |
        flake8 scripts/ api/ tests/

    - name: Run type checking (mypy)
      run: |
        mypy scripts/ api/ --ignore-missing-imports || true

  # ============================================================================
  # Documentation Tests
  # ============================================================================
  documentation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/_build/html/

  # ============================================================================
  # Test Summary
  # ============================================================================
  test-summary:
    runs-on: ubuntu-latest
    needs: [
      python-unit-tests,
      python-integration-tests,
      javascript-tests,
      e2e-tests,
      performance-tests,
      security-tests,
      code-quality
    ]
    if: always()

    steps:
    - name: Test Results Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Python Unit Tests: ${{ needs.python-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "### Python Integration Tests: ${{ needs.python-integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "### JavaScript Tests: ${{ needs.javascript-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "### E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "### Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "### Security Tests: ${{ needs.security-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "### Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ needs.python-unit-tests.result }}" == "failure" ||
              "${{ needs.python-integration-tests.result }}" == "failure" ||
              "${{ needs.javascript-tests.result }}" == "failure" ||
              "${{ needs.e2e-tests.result }}" == "failure" ||
              "${{ needs.security-tests.result }}" == "failure" ||
              "${{ needs.code-quality.result }}" == "failure" ]]; then
          echo "❌ Some tests failed. Please check the logs." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
        fi
