name: Branch Protection Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  checks: write

jobs:
  enforce-branch-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.pull_request.title;
            const validPrefixes = ['feat:', 'fix:', 'docs:', 'style:', 'refactor:', 'perf:', 'test:', 'build:', 'ci:', 'chore:', 'revert:'];
            
            const hasValidPrefix = validPrefixes.some(prefix => title.toLowerCase().startsWith(prefix));
            
            if (!hasValidPrefix) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **PR Title Format Check**\n\nYour PR title should start with one of these prefixes:\n- ${validPrefixes.join('\n- ')}\n\nExample: \`feat: add new feature\` or \`fix: resolve bug\``
              });
            }

      - name: Check PR description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            
            if (body.trim().length < 30) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **PR Description Check**\n\nPlease provide a meaningful description for this PR. It should include:\n- What changes were made\n- Why these changes were necessary\n- How to test the changes\n\nA good description helps reviewers understand your changes better.`
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-description']
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: 'needs-description'
                });
              } catch (error) {
                // Label might not exist
              }
            }

      - name: Check for linked issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title;
            
            // Check for issue references
            const issueRegex = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/gi;
            const hasLinkedIssue = issueRegex.test(body) || issueRegex.test(title);
            
            if (!hasLinkedIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `💡 **Tip: Link Related Issues**\n\nIf this PR addresses an existing issue, please link it using:\n- \`Closes #123\`\n- \`Fixes #123\`\n- \`Resolves #123\`\n\nThis helps track which issues are being worked on and automatically closes them when the PR is merged.`
              });
            }

      - name: Verify no direct commits to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            
            if (baseBranch === 'main' || baseBranch === 'master') {
              console.log('✅ PR targets protected branch correctly');
            }
