name: Documentation CI

on:
  push:
    paths:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          npm install -g markdownlint-cli || echo "markdownlint-cli install failed"
          npm install -g markdown-link-check || echo "markdown-link-check install failed"
          
      - name: Markdown Linting
        continue-on-error: true
        run: |
          markdownlint '**/*.md' --ignore node_modules --ignore web/node_modules --ignore webui/node_modules --config .markdownlint.json || echo "Markdown linting completed with warnings"
        
      - name: Link Validation (Sample)
        continue-on-error: true
        run: |
          # Only check main docs to avoid timeout
          markdown-link-check README.md || echo "Link check completed with warnings"
          markdown-link-check TASKS.md || echo "Link check completed with warnings"
          markdown-link-check RECOMMENDATIONS.md || echo "Link check completed with warnings"
          
      - name: Traceability Check
        run: |
          python3 .github/scripts/doc_trace.py
          
  summary:
    needs: validate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Documentation Check Summary
        run: |
          echo "Documentation validation completed"
          echo "Status: ${{ needs.validate.result }}"
