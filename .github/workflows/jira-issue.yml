name: Create Jira Issue from TASKS.md

on:
  push:
    paths:
      - 'TASKS.md'

jobs:
  create-jira-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse TASKS.md and create Jira issues
        run: |
          python3 .github/scripts/jira_sync.py
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
