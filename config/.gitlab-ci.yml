stages:
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  POSTGRES_DB: "opendiscourse_test"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

before_script:
  - python -V
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt
  - python -m pip install pytest pytest-cov

unit_test:
  stage: test
  script:
    - pytest --cov=.
  coverage: '/TOTAL.* ([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

lint:
  stage: test
  script:
    - pip install flake8 black
    - flake8 .
    - black --check .

build:
  stage: build
  script:
    - echo "Building docker image"
  only:
    - main

deploy:
  stage: deploy
  script:
    - echo "Deploying to production"
  only:
    - main
