[metadata]
description-file = README.md
license_files = LICENSE

[options.packages.find]
where = .
include = opendiscourse*
exclude =
    tests
    examples
    docs
    scripts

[options.package_data]
* = *.yaml, *.yml, *.json, *.csv

# PyTest Configuration
[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -v
