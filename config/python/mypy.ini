[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
show_error_context = True
show_column_numbers = True
show_error_codes = True
pretty = True

# Per-module options:
[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-psycopg2]
ignore_missing_imports = True

[mypy-psycopg2.extensions]
ignore_missing_imports = True

[mypy-psycopg2.extras]
ignore_missing_imports = True

[mypy-psycopg2.pool]
ignore_missing_imports = True

# Ignore missing stubs for these packages
[mypy-psycopg2.*,psycopg2.extras.*,psycopg2.pool.*]
ignore_missing_imports = True

[mypy-psycopg2-binary.*]
ignore_missing_imports = True

[mypy-PyYAML.*]
ignore_missing_imports = True

# Ignore test files
[mypy-tests.*]
ignore_errors = True

[mypy-*.tests.*]
ignore_errors = True

# Ignore specific files
[mypy-update_imports.py]
ignore_errors = True

[mypy-scripts.*]
ignore_errors = True

[mypy-docs.*]
ignore_errors = True

# Strict type checking for our code
[mypy-opendiscourse.*]
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Ignore specific error codes
[mypy]
# Ignore missing return statements in functions that never return (e.g., sys.exit())
warn_no_return = False

# Ignore missing imports in __init__.py files
[mypy-__init__]
ignore_missing_imports = True

# Ignore missing stubs for test dependencies
[mypy-pytest.*]
ignore_missing_imports = True

[mypy-pytest]
ignore_missing_imports = True

# Ignore missing stubs for development dependencies
[mypy-black.*]
ignore_missing_imports = True

[mypy-isort.*]
ignore_missing_imports = True

[mypy-mypy.*]
ignore_missing_imports = True

[mypy-ruff.*]
ignore_missing_imports = True

# Ignore specific files that need more work
[mypy-opendiscourse/verify_integration.py]
ignore_errors = True

[mypy-opendiscourse/integration_setup.py]
ignore_errors = True

[mypy-opendiscourse/govinfo_scraper.py]
ignore_errors = True

[mypy-opendiscourse/govinfo_document_processor.py]
ignore_errors = True
