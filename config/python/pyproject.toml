[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendiscourse"
version = "0.1.0"
description = "OpenDiscourse - A platform for analyzing political discourse"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "OpenDiscourse Team", email = "team@opendiscourse.org"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "sqlalchemy>=2.0.23",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "requests>=2.32.4",
    "pandas>=2.1.0",
    "numpy>=1.24.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.0.275",
    "pre-commit>=3.0.0",
    "ipython>=8.0.0"
]

docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0"
]

ml = [
    "transformers>=4.50.0",
    "torch>=1.11.0",
    "openai>=1.3.0",
    "langchain>=0.2.5",
    "sentence-transformers>=2.2.2"
]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "I"]  # Basic error checking
unfixable = []

[tool.ruff.isort]
known-first-party = ["opendiscourse"]
