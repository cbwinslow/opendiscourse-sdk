<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - OpenDiscourse</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f8fafc;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        mark {
            background-color: #fef3c7;
            color: #92400e;
            padding: 0.1rem 0.2rem;
            border-radius: 0.25rem;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        secondary: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                    },
                },
            },
        }
    </script>
</head>
<body>
    <div id="search-root"></div>

    <script type="text/babel">
        const { useState, useCallback, useEffect } = React;
        const { createRoot } = ReactDOM;

        function SearchInterface() {
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [totalResults, setTotalResults] = useState(0);
            const [currentPage, setCurrentPage] = useState(1);
            const [searchMode, setSearchMode] = useState('semantic');
            const [filters, setFilters] = useState({});

            // Sample results for demonstration
            const sampleResults = [
                {
                    id: '1',
                    title: 'Infrastructure Investment and Jobs Act',
                    content: 'The Infrastructure Investment and Jobs Act (IIJA), also known as the Bipartisan Infrastructure Law, is a United States federal statute enacted by the 117th United States Congress and signed into law by President Joe Biden on November 15, 2021.',
                    score: 0.95,
                    source: 'congress.gov',
                    entities: ['Joe Biden', 'Congress', 'Infrastructure'],
                    highlights: ['Infrastructure', 'Investment', 'Jobs']
                },
                {
                    id: '2',
                    title: 'Build Back Better Act',
                    content: 'The Build Back Better Act was a bill introduced in the 117th Congress (2021–2023) by Democrats in the U.S. House of Representatives and U.S. Senate to fulfill aspects of President Joe Biden\'s domestic policy agenda.',
                    score: 0.87,
                    source: 'house.gov',
                    entities: ['Joe Biden', 'Democrats', 'House of Representatives'],
                    highlights: ['Build Back Better', 'domestic policy']
                },
                {
                    id: '3',
                    title: 'American Rescue Plan Act',
                    content: 'The American Rescue Plan Act of 2021, also called the COVID-19 Stimulus Package or American Rescue Plan, is a US$1.9 trillion economic stimulus bill passed by the 117th United States Congress.',
                    score: 0.82,
                    source: 'senate.gov',
                    entities: ['Congress', 'COVID-19', 'Economic Stimulus'],
                    highlights: ['American Rescue Plan', 'stimulus', 'trillion']
                }
            ];

            const performSearch = useCallback(async (searchQuery, searchFilters, page = 1) => {
                if (!searchQuery.trim()) return;

                setLoading(true);
                setError(null);

                try {
                    // Try to call backend API first
                    try {
                        const apiResponse = await fetch('/search', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                query: searchQuery,
                                k: 10,
                                filters: searchFilters || {}
                            })
                        });

                        if (apiResponse.ok) {
                            const apiData = await apiResponse.json();
                            
                            // Transform API response to UI format
                            const transformedResults = apiData.results.map((result, index) => ({
                                id: result.document_id || `api-${index}`,
                                title: result.title || result.metadata?.title || 'Untitled Document',
                                content: result.content || result.text || 'No content available',
                                score: result.score || 0.5,
                                source: result.metadata?.source || 'api',
                                entities: result.metadata?.entities || [],
                                highlights: []
                            }));
                            
                            setResults(transformedResults);
                            setTotalResults(apiData.metadata?.total_results || transformedResults.length);
                            setCurrentPage(page);
                            return;
                        }
                    } catch (apiError) {
                        console.warn('API search failed, falling back to demo data:', apiError);
                    }

                    // Fallback to demo data if API fails
                    const filteredResults = sampleResults.filter(result => 
                        result.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        result.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        result.entities.some(entity => 
                            entity.toLowerCase().includes(searchQuery.toLowerCase())
                        )
                    );
                    
                    setResults(filteredResults);
                    setTotalResults(filteredResults.length);
                    setCurrentPage(page);
                } catch (err) {
                    setError('Search failed. Please try again.');
                    setResults([]);
                } finally {
                    setLoading(false);
                }
            }, [searchMode]);

            const handleSearch = useCallback((e) => {
                e.preventDefault();
                performSearch(query, filters, 1);
            }, [query, filters, performSearch]);

            const highlightText = (text, highlights) => {
                if (!highlights.length) return text;
                
                let highlightedText = text;
                highlights.forEach(highlight => {
                    const regex = new RegExp(`(${highlight})`, 'gi');
                    highlightedText = highlightedText.replace(regex, '<mark>$1</mark>');
                });
                
                return highlightedText;
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center py-4">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">Document Search</h1>
                                    <p className="text-sm text-gray-600 mt-1">Search across government documents and legislative content</p>
                                </div>
                                <a href="/web/index.html" className="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">
                                    ← Back to Dashboard
                                </a>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
                        <div className="space-y-6">
                            {/* Search Form */}
                            <div className="bg-white rounded-lg border border-gray-200 p-6">
                                <form onSubmit={handleSearch} className="space-y-4">
                                    <div className="flex space-x-4">
                                        <div className="flex-1">
                                            <label htmlFor="search-query" className="block text-sm font-medium text-gray-700 mb-2">
                                                Search Query
                                            </label>
                                            <div className="relative">
                                                <input
                                                    id="search-query"
                                                    type="text"
                                                    value={query}
                                                    onChange={(e) => setQuery(e.target.value)}
                                                    placeholder="Enter your search query..."
                                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                                />
                                                <button
                                                    type="submit"
                                                    disabled={loading || !query.trim()}
                                                    className="absolute right-2 top-1/2 transform -translate-y-1/2 p-2 text-blue-600 hover:text-blue-700 disabled:text-gray-400"
                                                >
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                                    </svg>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex space-x-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Search Mode</label>
                                            <select
                                                value={searchMode}
                                                onChange={(e) => setSearchMode(e.target.value)}
                                                className="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            >
                                                <option value="semantic">Semantic Search</option>
                                                <option value="keyword">Keyword Search</option>
                                                <option value="hybrid">Hybrid Search</option>
                                            </select>
                                        </div>

                                        <div className="flex-1">
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Quick Filters</label>
                                            <div className="flex space-x-2">
                                                <button
                                                    type="button"
                                                    className="px-3 py-2 text-sm rounded-lg border bg-white border-gray-300 text-gray-700 hover:bg-gray-50"
                                                >
                                                    High Relevance
                                                </button>
                                                <button
                                                    type="button"
                                                    className="px-3 py-2 text-sm rounded-lg border bg-white border-gray-300 text-gray-700 hover:bg-gray-50"
                                                >
                                                    Congress Only
                                                </button>
                                                <button
                                                    type="button"
                                                    className="px-3 py-2 text-sm rounded-lg border bg-white border-gray-300 text-gray-700 hover:bg-gray-50"
                                                >
                                                    Clear Filters
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            {/* Search Results */}
                            {loading && (
                                <div className="bg-white rounded-lg border border-gray-200 p-8 text-center">
                                    <div className="inline-flex items-center space-x-2">
                                        <svg className="animate-spin w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                                        </svg>
                                        <span className="text-gray-600">Searching...</span>
                                    </div>
                                </div>
                            )}

                            {error && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                                    <div className="flex items-center space-x-2">
                                        <svg className="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                                            <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                                        </svg>
                                        <span className="text-red-700">{error}</span>
                                    </div>
                                </div>
                            )}

                            {!loading && !error && results.length === 0 && query && (
                                <div className="bg-white rounded-lg border border-gray-200 p-8 text-center">
                                    <svg className="mx-auto w-12 h-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                    <h3 className="text-lg font-semibold text-gray-900 mb-2">No results found</h3>
                                    <p className="text-gray-600">Try adjusting your search terms or filters</p>
                                </div>
                            )}

                            {!loading && !error && results.length > 0 && (
                                <div className="space-y-4">
                                    {/* Results Header */}
                                    <div className="flex items-center justify-between">
                                        <p className="text-sm text-gray-600">
                                            Showing {results.length} results for "{query}"
                                        </p>
                                        <div className="flex items-center space-x-2">
                                            <span className="text-sm text-gray-600">Sort by:</span>
                                            <select className="text-sm border border-gray-300 rounded px-2 py-1">
                                                <option value="relevance">Relevance</option>
                                                <option value="date">Date</option>
                                                <option value="title">Title</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* Results List */}
                                    <div className="space-y-4">
                                        {results.map((result) => (
                                            <div key={result.id} className="bg-white rounded-lg border border-gray-200 p-6 hover:shadow-md transition-shadow">
                                                <div className="space-y-3">
                                                    <div className="flex items-start justify-between">
                                                        <h3 className="text-lg font-semibold text-gray-900 hover:text-blue-600 cursor-pointer">
                                                            {result.title}
                                                        </h3>
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">
                                                                Score: {(result.score * 100).toFixed(0)}%
                                                            </span>
                                                            <span className="text-xs bg-gray-100 text-gray-800 px-2 py-1 rounded-full">
                                                                {result.source}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    <div 
                                                        className="text-gray-700 line-clamp-3"
                                                        dangerouslySetInnerHTML={{ 
                                                            __html: highlightText(result.content, result.highlights) 
                                                        }}
                                                    />

                                                    {result.entities.length > 0 && (
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-xs font-medium text-gray-600">Entities:</span>
                                                            <div className="flex flex-wrap gap-1">
                                                                {result.entities.slice(0, 5).map((entity, idx) => (
                                                                    <span key={idx} className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">
                                                                        {entity}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}

                                                    <div className="flex items-center justify-between text-sm text-gray-500">
                                                        <span>Document ID: {result.id}</span>
                                                        <div className="flex space-x-4">
                                                            <button className="text-blue-600 hover:text-blue-700 font-medium">
                                                                View Full Document
                                                            </button>
                                                            <button className="text-gray-600 hover:text-gray-700">
                                                                Export
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Quick Search Examples */}
                            {!query && (
                                <div className="bg-white rounded-lg border border-gray-200 p-6">
                                    <h3 className="text-lg font-semibold text-gray-900 mb-4">Quick Search Examples</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <button
                                            onClick={() => setQuery('infrastructure spending')}
                                            className="text-left p-3 border border-gray-200 rounded-lg hover:bg-gray-50"
                                        >
                                            <span className="font-medium text-blue-600">Infrastructure spending</span>
                                            <p className="text-sm text-gray-600 mt-1">Find documents about infrastructure investments</p>
                                        </button>
                                        <button
                                            onClick={() => setQuery('climate change legislation')}
                                            className="text-left p-3 border border-gray-200 rounded-lg hover:bg-gray-50"
                                        >
                                            <span className="font-medium text-blue-600">Climate change legislation</span>
                                            <p className="text-sm text-gray-600 mt-1">Search for climate-related policies</p>
                                        </button>
                                        <button
                                            onClick={() => setQuery('healthcare reform')}
                                            className="text-left p-3 border border-gray-200 rounded-lg hover:bg-gray-50"
                                        >
                                            <span className="font-medium text-blue-600">Healthcare reform</span>
                                            <p className="text-sm text-gray-600 mt-1">Explore healthcare policy documents</p>
                                        </button>
                                        <button
                                            onClick={() => setQuery('tax policy')}
                                            className="text-left p-3 border border-gray-200 rounded-lg hover:bg-gray-50"
                                        >
                                            <span className="font-medium text-blue-600">Tax policy</span>
                                            <p className="text-sm text-gray-600 mt-1">Find tax-related legislation</p>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        // Mount the React app
        const container = document.getElementById('search-root');
        const root = createRoot(container);
        root.render(<SearchInterface />);
    </script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
