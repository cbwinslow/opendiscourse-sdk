<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Crawler - OpenDiscourse</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .research-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .typing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #667eea;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator:nth-child(2) { animation-delay: -0.16s; }
        .typing-indicator:nth-child(3) { animation-delay: 0s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f4ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        },
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="research-root"></div>

    <script type="text/babel">
        const { useState, useCallback, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;

        function ResearchCrawler() {
            const [query, setQuery] = useState('');
            const [searchDepth, setSearchDepth] = useState(3);
            const [maxPages, setMaxPages] = useState(10);
            const [domains, setDomains] = useState('');
            const [reportType, setReportType] = useState('comprehensive');
            const [language, setLanguage] = useState('en');
            const [includeImages, setIncludeImages] = useState(false);
            const [includeTables, setIncludeTables] = useState(true);
            const [dateRange, setDateRange] = useState('all');
            const [researching, setResearching] = useState(false);
            const [progress, setProgress] = useState(0);
            const [currentStep, setCurrentStep] = useState('');
            const [reports, setReports] = useState([]);
            const [selectedReport, setSelectedReport] = useState(null);
            const [activeTab, setActiveTab] = useState('research');

            const progressRef = useRef(null);

            // Sample research reports for demonstration
            const sampleReports = [
                {
                    id: 1,
                    title: "Infrastructure Investment Analysis",
                    query: "Infrastructure spending impact on economic growth",
                    timestamp: "2024-01-15T10:30:00Z",
                    status: "completed",
                    pages_crawled: 25,
                    summary: "Analysis of recent infrastructure investment legislation and its projected economic impact.",
                    sources: 25,
                    content: `# Infrastructure Investment Analysis Report

## Executive Summary
The Infrastructure Investment and Jobs Act represents a significant federal commitment to modernizing America's infrastructure, with $1.2 trillion allocated over five years.

## Key Findings
- **Economic Impact**: Projected to create 2 million jobs annually
- **Funding Distribution**: 
  - Transportation: $567B (47%)
  - Broadband: $65B (5.4%)
  - Power Infrastructure: $73B (6.1%)
  - Water Systems: $55B (4.6%)

## Regional Analysis
The investment is expected to benefit rural and urban areas differently:
- Rural areas will see significant broadband expansion
- Urban centers will benefit from transit modernization
- Coastal regions will receive resilience infrastructure funding

## Timeline and Implementation
- Phase 1 (2022-2024): Foundation projects
- Phase 2 (2024-2026): Major infrastructure overhauls
- Phase 3 (2026-2027): Completion and assessment

## Challenges and Opportunities
**Challenges:**
- Skilled labor shortages in construction
- Supply chain disruptions
- Regulatory approval delays

**Opportunities:**
- Technology integration in infrastructure
- Green energy transition acceleration
- Economic multiplier effects

## Conclusion
The infrastructure investment represents a transformative opportunity for economic growth, with careful implementation being crucial for success.`
                },
                {
                    id: 2,
                    title: "Climate Change Policy Research",
                    query: "Federal climate change mitigation strategies",
                    timestamp: "2024-01-14T15:45:00Z",
                    status: "completed",
                    pages_crawled: 18,
                    summary: "Comprehensive review of current and proposed federal climate policies.",
                    sources: 18,
                    content: `# Climate Change Policy Research Report

## Overview
Federal climate change mitigation strategies have evolved significantly, with new policies targeting carbon reduction and renewable energy adoption.

## Current Policy Framework
- Clean Air Act regulations
- Renewable Energy Standards
- Carbon pricing mechanisms
- Green investment incentives

## Recent Developments
The Biden administration has introduced several key initiatives aimed at achieving net-zero emissions by 2050.

## Implementation Challenges
Policy implementation faces several hurdles including state-level resistance and industry compliance costs.`
                }
            ];

            const startResearch = useCallback(async () => {
                if (!query.trim()) return;

                setResearching(true);
                setProgress(0);
                setCurrentStep('Starting research...');

                try {
                    // Submit research request to backend
                    const response = await fetch('/v1/research/start', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            query: query,
                            search_depth: searchDepth,
                            max_pages: maxPages,
                            domains: domains || null,
                            report_type: reportType,
                            language: language,
                            include_images: includeImages,
                            include_tables: includeTables,
                            date_range: dateRange
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to start research');
                    }

                    const result = await response.json();
                    const taskId = result.task_id;

                    // Poll for status updates
                    const pollStatus = async () => {
                        try {
                            const statusResponse = await fetch(`/v1/research/status/${taskId}`);
                            if (statusResponse.ok) {
                                const status = await statusResponse.json();
                                setProgress(status.progress);
                                setCurrentStep(status.current_step);

                                if (status.status === 'completed') {
                                    // Refresh reports list
                                    const reportsResponse = await fetch('/v1/research/reports');
                                    if (reportsResponse.ok) {
                                        const reportsData = await reportsResponse.json();
                                        setReports(reportsData);
                                    }
                                    setResearching(false);
                                    setActiveTab('reports');
                                    setQuery('');
                                    return;
                                } else if (status.status === 'failed') {
                                    throw new Error('Research failed');
                                }

                                // Continue polling
                                setTimeout(pollStatus, 2000);
                            }
                        } catch (error) {
                            console.error('Status polling error:', error);
                            setResearching(false);
                        }
                    };

                    // Start status polling
                    setTimeout(pollStatus, 1000);

                } catch (error) {
                    console.error('Research error:', error);
                    setResearching(false);
                    
                    // Fallback to demo mode
                    const newReport = {
                        id: Date.now(),
                        title: query,
                        query: query,
                        timestamp: new Date().toISOString(),
                        status: "completed",
                        pages_crawled: Math.floor(Math.random() * maxPages) + 5,
                        summary: `Research report generated for: ${query} (Demo Mode)`,
                        sources: Math.floor(Math.random() * maxPages) + 5,
                        content: `# ${query} - Research Report (Demo Mode)

## Executive Summary
This report was generated in demo mode. In production, this would be based on web crawling and AI analysis.

## Methodology
- Search depth: ${searchDepth} levels
- Maximum pages: ${maxPages}
- Language: ${language}
- Date range: ${dateRange}

## Key Findings
Based on the configured parameters, this is a demonstration of the research output format.

## Conclusion
This demonstrates the research report structure that would be generated from actual web crawling.

*Demo report generated on ${new Date().toLocaleString()}*`
                    };

                    setReports(prev => [newReport, ...prev]);
                    setActiveTab('reports');
                    setQuery('');
                }
            }, [query, searchDepth, maxPages, domains, reportType, language, includeImages, includeTables, dateRange]);

            const deleteReport = useCallback((reportId) => {
                setReports(prev => prev.filter(r => r.id !== reportId));
                if (selectedReport && selectedReport.id === reportId) {
                    setSelectedReport(null);
                }
            }, [selectedReport]);

            const formatDate = (dateString) => {
                return new Date(dateString).toLocaleString();
            };

            // Initialize with sample reports
            useEffect(() => {
                if (reports.length === 0) {
                    setReports(sampleReports);
                }
            }, []);

            return (
                <div className="min-h-screen gradient-bg">
                    {/* Header */}
                    <div className="glass-morphism">
                        <div className="max-w-6xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <div className="w-8 h-8 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                                        <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-white">AI Research Crawler</h1>
                                        <p className="text-white text-opacity-80 text-sm">Generate comprehensive research reports from web data</p>
                                    </div>
                                </div>
                                <a href="navigation.html" className="px-4 py-2 bg-white bg-opacity-20 text-white rounded-lg hover:bg-opacity-30 transition-all">
                                    ← Dashboard
                                </a>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-4 py-8">
                        {/* Tab Navigation */}
                        <div className="flex space-x-1 mb-8">
                            <button
                                onClick={() => setActiveTab('research')}
                                className={`px-6 py-3 rounded-lg font-medium transition-all ${
                                    activeTab === 'research'
                                        ? 'bg-white text-primary-600 shadow-lg'
                                        : 'bg-white bg-opacity-20 text-white hover:bg-opacity-30'
                                }`}
                            >
                                New Research
                            </button>
                            <button
                                onClick={() => setActiveTab('reports')}
                                className={`px-6 py-3 rounded-lg font-medium transition-all ${
                                    activeTab === 'reports'
                                        ? 'bg-white text-primary-600 shadow-lg'
                                        : 'bg-white bg-opacity-20 text-white hover:bg-opacity-30'
                                }`}
                            >
                                Reports ({reports.length})
                            </button>
                        </div>

                        {/* Research Tab */}
                        {activeTab === 'research' && (
                            <div className="space-y-6">
                                {/* Main Research Form */}
                                <div className="research-card rounded-2xl p-8">
                                    <div className="mb-6">
                                        <h2 className="text-2xl font-bold text-gray-900 mb-2">Start New Research</h2>
                                        <p className="text-gray-600">Configure your research parameters and let AI generate comprehensive reports</p>
                                    </div>

                                    <div className="space-y-6">
                                        {/* Research Query */}
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-900 mb-3">Research Question</label>
                                            <textarea
                                                value={query}
                                                onChange={(e) => setQuery(e.target.value)}
                                                placeholder="What would you like to research? e.g., 'Impact of renewable energy policies on economic growth'"
                                                rows={3}
                                                className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary-500 focus:ring-0 resize-none"
                                            />
                                        </div>

                                        {/* Configuration Grid */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {/* Search Depth */}
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-900 mb-2">Search Depth</label>
                                                <select
                                                    value={searchDepth}
                                                    onChange={(e) => setSearchDepth(parseInt(e.target.value))}
                                                    className="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:ring-0"
                                                >
                                                    <option value={1}>Shallow (1 level)</option>
                                                    <option value={2}>Medium (2 levels)</option>
                                                    <option value={3}>Deep (3 levels)</option>
                                                    <option value={4}>Very Deep (4 levels)</option>
                                                </select>
                                            </div>

                                            {/* Max Pages */}
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-900 mb-2">Max Pages</label>
                                                <select
                                                    value={maxPages}
                                                    onChange={(e) => setMaxPages(parseInt(e.target.value))}
                                                    className="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:ring-0"
                                                >
                                                    <option value={5}>5 pages</option>
                                                    <option value={10}>10 pages</option>
                                                    <option value={25}>25 pages</option>
                                                    <option value={50}>50 pages</option>
                                                    <option value={100}>100 pages</option>
                                                </select>
                                            </div>

                                            {/* Report Type */}
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-900 mb-2">Report Type</label>
                                                <select
                                                    value={reportType}
                                                    onChange={(e) => setReportType(e.target.value)}
                                                    className="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:ring-0"
                                                >
                                                    <option value="comprehensive">Comprehensive</option>
                                                    <option value="summary">Executive Summary</option>
                                                    <option value="detailed">Detailed Analysis</option>
                                                    <option value="comparative">Comparative Study</option>
                                                </select>
                                            </div>

                                            {/* Language */}
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-900 mb-2">Language</label>
                                                <select
                                                    value={language}
                                                    onChange={(e) => setLanguage(e.target.value)}
                                                    className="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:ring-0"
                                                >
                                                    <option value="en">English</option>
                                                    <option value="es">Spanish</option>
                                                    <option value="fr">French</option>
                                                    <option value="de">German</option>
                                                    <option value="all">All Languages</option>
                                                </select>
                                            </div>

                                            {/* Date Range */}
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-900 mb-2">Date Range</label>
                                                <select
                                                    value={dateRange}
                                                    onChange={(e) => setDateRange(e.target.value)}
                                                    className="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:ring-0"
                                                >
                                                    <option value="all">All Time</option>
                                                    <option value="1month">Last Month</option>
                                                    <option value="3months">Last 3 Months</option>
                                                    <option value="1year">Last Year</option>
                                                    <option value="2years">Last 2 Years</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* Domain Filters */}
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-900 mb-2">Domain Filters (Optional)</label>
                                            <input
                                                value={domains}
                                                onChange={(e) => setDomains(e.target.value)}
                                                placeholder="e.g., .gov, .edu, .org (comma-separated)"
                                                className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary-500 focus:ring-0"
                                            />
                                        </div>

                                        {/* Content Options */}
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-900 mb-3">Content Options</label>
                                            <div className="flex flex-wrap gap-4">
                                                <label className="flex items-center space-x-2">
                                                    <input
                                                        type="checkbox"
                                                        checked={includeImages}
                                                        onChange={(e) => setIncludeImages(e.target.checked)}
                                                        className="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500"
                                                    />
                                                    <span className="text-sm text-gray-700">Include Images</span>
                                                </label>
                                                <label className="flex items-center space-x-2">
                                                    <input
                                                        type="checkbox"
                                                        checked={includeTables}
                                                        onChange={(e) => setIncludeTables(e.target.checked)}
                                                        className="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500"
                                                    />
                                                    <span className="text-sm text-gray-700">Include Tables/Data</span>
                                                </label>
                                            </div>
                                        </div>

                                        {/* Start Research Button */}
                                        <div className="pt-4">
                                            <button
                                                onClick={startResearch}
                                                disabled={researching || !query.trim()}
                                                className="w-full bg-gradient-to-r from-primary-600 to-primary-700 text-white font-semibold py-4 px-6 rounded-xl hover:from-primary-700 hover:to-primary-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 shadow-lg"
                                            >
                                                {researching ? (
                                                    <div className="flex items-center justify-center space-x-3">
                                                        <div className="flex space-x-1">
                                                            <div className="typing-indicator"></div>
                                                            <div className="typing-indicator"></div>
                                                            <div className="typing-indicator"></div>
                                                        </div>
                                                        <span>Researching...</span>
                                                    </div>
                                                ) : (
                                                    'Start AI Research'
                                                )}
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Progress Display */}
                                {researching && (
                                    <div className="research-card rounded-2xl p-6">
                                        <div className="space-y-4">
                                            <div className="flex items-center justify-between">
                                                <h3 className="text-lg font-semibold text-gray-900">Research Progress</h3>
                                                <span className="text-sm font-medium text-primary-600">{Math.round(progress)}%</span>
                                            </div>
                                            <div className="w-full bg-gray-200 rounded-full h-3">
                                                <div
                                                    className="bg-gradient-to-r from-primary-500 to-primary-600 h-3 rounded-full transition-all duration-500"
                                                    style={{ width: `${progress}%` }}
                                                ></div>
                                            </div>
                                            <p className="text-sm text-gray-600 flex items-center space-x-2">
                                                <svg className="w-4 h-4 animate-spin text-primary-500" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                <span>{currentStep}</span>
                                            </p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Reports Tab */}
                        {activeTab === 'reports' && (
                            <div className="space-y-6">
                                {!selectedReport ? (
                                    <>
                                        <div className="research-card rounded-2xl p-6">
                                            <div className="flex items-center justify-between mb-4">
                                                <h2 className="text-xl font-bold text-gray-900">Research Reports</h2>
                                                <span className="px-3 py-1 bg-primary-100 text-primary-800 rounded-full text-sm font-medium">
                                                    {reports.length} reports
                                                </span>
                                            </div>
                                        </div>

                                        {reports.length === 0 ? (
                                            <div className="research-card rounded-2xl p-12 text-center">
                                                <svg className="mx-auto w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                                </svg>
                                                <h3 className="text-lg font-semibold text-gray-900 mb-2">No reports yet</h3>
                                                <p className="text-gray-600 mb-4">Start your first research to generate comprehensive reports</p>
                                                <button
                                                    onClick={() => setActiveTab('research')}
                                                    className="px-6 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors"
                                                >
                                                    Start Research
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="grid gap-6">
                                                {reports.map((report) => (
                                                    <div key={report.id} className="research-card rounded-2xl p-6 hover:shadow-xl transition-all cursor-pointer" onClick={() => setSelectedReport(report)}>
                                                        <div className="flex items-start justify-between">
                                                            <div className="flex-1">
                                                                <h3 className="text-lg font-semibold text-gray-900 mb-2">{report.title}</h3>
                                                                <p className="text-gray-600 mb-3">{report.summary}</p>
                                                                <div className="flex items-center space-x-4 text-sm text-gray-500">
                                                                    <span className="flex items-center space-x-1">
                                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                                        </svg>
                                                                        <span>{formatDate(report.timestamp)}</span>
                                                                    </span>
                                                                    <span className="flex items-center space-x-1">
                                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                                                        </svg>
                                                                        <span>{report.pages_crawled} pages</span>
                                                                    </span>
                                                                    <span className="flex items-center space-x-1">
                                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                                                                        </svg>
                                                                        <span>{report.sources} sources</span>
                                                                    </span>
                                                                </div>
                                                            </div>
                                                            <div className="flex items-center space-x-2 ml-4">
                                                                <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                                                                    report.status === 'completed' 
                                                                        ? 'bg-green-100 text-green-800' 
                                                                        : 'bg-yellow-100 text-yellow-800'
                                                                }`}>
                                                                    {report.status}
                                                                </span>
                                                                <button
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        deleteReport(report.id);
                                                                    }}
                                                                    className="p-1 text-gray-400 hover:text-red-600 transition-colors"
                                                                >
                                                                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                                                        <path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd" />
                                                                    </svg>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </>
                                ) : (
                                    // Report Detail View
                                    <div className="space-y-6">
                                        <div className="research-card rounded-2xl p-6">
                                            <div className="flex items-center justify-between mb-4">
                                                <button
                                                    onClick={() => setSelectedReport(null)}
                                                    className="flex items-center space-x-2 text-gray-600 hover:text-gray-900 transition-colors"
                                                >
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                                                    </svg>
                                                    <span>Back to Reports</span>
                                                </button>
                                                <div className="flex items-center space-x-3">
                                                    <button className="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                                                        Download PDF
                                                    </button>
                                                    <button className="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                                                        Share
                                                    </button>
                                                </div>
                                            </div>
                                            <div className="border-b border-gray-200 pb-4 mb-6">
                                                <h1 className="text-2xl font-bold text-gray-900 mb-2">{selectedReport.title}</h1>
                                                <div className="flex items-center space-x-4 text-sm text-gray-500">
                                                    <span>Generated on {formatDate(selectedReport.timestamp)}</span>
                                                    <span>•</span>
                                                    <span>{selectedReport.pages_crawled} pages crawled</span>
                                                    <span>•</span>
                                                    <span>{selectedReport.sources} sources analyzed</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="research-card rounded-2xl p-8">
                                            <div className="prose max-w-none">
                                                <div dangerouslySetInnerHTML={{ __html: selectedReport.content.replace(/\n/g, '<br>').replace(/#{1,6}\s/g, match => `<h${match.trim().length} class="font-bold text-gray-900 mt-6 mb-3">`) }} />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Mount the React app
        const container = document.getElementById('research-root');
        const root = createRoot(container);
        root.render(<ResearchCrawler />);
    </script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
