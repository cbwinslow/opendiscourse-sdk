<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exa Search</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1000px; margin: auto; }
        #results { margin-top: 20px; }
        .result { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .query-tabs { margin-top: 20px; }
        .tab-buttons button { margin-right: 5px; }
        .tab-content { display: none; border: 1px solid #ccc; padding: 10px; margin-top: 5px; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
<div class="container">
    <h1>Exa Search</h1>
    <label>Search Query: <input type="text" id="query" size="60"></label>
    <label>Results: <input type="number" id="numResults" value="10" min="1" max="50"></label>
    <label>Match Threshold: <input type="number" id="matchThreshold" value="0.7" step="0.1" min="0" max="1"></label>
    <button id="searchBtn">Search</button>

    <div class="query-tabs">
        <div class="tab-buttons">
            <button data-lang="json">JSON</button>
            <button data-lang="curl">cURL</button>
            <button data-lang="python">Python</button>
            <button data-lang="ts">TypeScript</button>
            <button data-lang="go">Go</button>
            <button data-lang="rust">Rust</button>
        </div>
        <div id="json" class="tab-content"></div>
        <div id="curl" class="tab-content"></div>
        <div id="python" class="tab-content"></div>
        <div id="ts" class="tab-content"></div>
        <div id="go" class="tab-content"></div>
        <div id="rust" class="tab-content"></div>
    </div>

    <div id="results"></div>
    <button id="ingestBtn">Ingest Selected</button>
</div>
<script src="exa_search.js"></script>
<script src="/web/static/js/track.js"></script>
</body>
</html>
