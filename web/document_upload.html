<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Upload - OpenDiscourse</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f8fafc;
        }
        .btn-primary {
            @apply bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors;
        }
        .btn-outline {
            @apply border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors;
        }
        .card {
            @apply bg-white rounded-lg border border-gray-200 shadow-sm;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        secondary: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                    },
                },
            },
        }
    </script>
</head>
<body>
    <div id="upload-root"></div>

    <script type="text/babel">
        const { useState, useCallback } = React;
        const { createRoot } = ReactDOM;

        function DocumentUpload({
            onUpload,
            maxFiles = 10,
            maxSize = 10 * 1024 * 1024, // 10MB default
            acceptedTypes = ['.pdf', '.docx', '.txt', '.md']
        }) {
            const [uploadedFiles, setUploadedFiles] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const [isDragActive, setIsDragActive] = useState(false);

            const handleDragEnter = (e) => {
                e.preventDefault();
                setIsDragActive(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setIsDragActive(false);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const handleDrop = async (e) => {
                e.preventDefault();
                setIsDragActive(false);
                
                const files = Array.from(e.dataTransfer.files);
                await processFiles(files);
            };

            const handleFileSelect = async (e) => {
                const files = Array.from(e.target.files);
                await processFiles(files);
            };

            const processFiles = async (files) => {
                if (files.length === 0) return;

                setIsUploading(true);
                
                // Create initial file entries
                const newFiles = files.map(file => ({
                    id: Math.random().toString(36).substr(2, 9),
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    status: 'uploading',
                    progress: 0
                }));

                setUploadedFiles(prev => [...prev, ...newFiles]);

                // Process each file
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileEntry = newFiles[i];

                    try {
                        await uploadFile(file, fileEntry.id);
                    } catch (error) {
                        setUploadedFiles(prev => 
                            prev.map(f => 
                                f.id === fileEntry.id 
                                    ? { ...f, status: 'error', error: error.message || 'Upload failed' }
                                    : f
                            )
                        );
                    }
                }

                setIsUploading(false);
                if (onUpload) {
                    onUpload(files);
                }
            };

            const uploadFile = async (file, fileId) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('metadata', JSON.stringify({
                    uploadTime: new Date().toISOString(),
                    source: 'web_ui'
                }));

                // Simulate progress updates
                for (let progress = 0; progress <= 100; progress += 20) {
                    setUploadedFiles(prev => 
                        prev.map(f => 
                            f.id === fileId 
                                ? { ...f, progress }
                                : f
                        )
                    );
                    await new Promise(resolve => setTimeout(resolve, 200));
                }

                // Simulate successful upload (replace with actual API call)
                try {
                    // const response = await fetch('/api/v1/ingest/documents', {
                    //     method: 'POST',
                    //     body: formData
                    // });
                    
                    // if (!response.ok) {
                    //     throw new Error(`Upload failed: ${response.statusText}`);
                    // }

                    setUploadedFiles(prev => 
                        prev.map(f => 
                            f.id === fileId 
                                ? { ...f, status: 'completed', progress: 100 }
                                : f
                        )
                    );
                } catch (error) {
                    throw error;
                }
            };

            const removeFile = (fileId) => {
                setUploadedFiles(prev => prev.filter(f => f.id !== fileId));
            };

            const formatFileSize = (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };

            return (
                <div className="w-full max-w-4xl mx-auto space-y-6 p-6">
                    {/* Upload Zone */}
                    <div
                        onDragEnter={handleDragEnter}
                        onDragLeave={handleDragLeave}
                        onDragOver={handleDragOver}
                        onDrop={handleDrop}
                        className={`
                            border-2 border-dashed rounded-lg p-8 text-center cursor-pointer transition-colors
                            ${isDragActive 
                                ? 'border-blue-400 bg-blue-50' 
                                : 'border-gray-300 hover:border-blue-400 hover:bg-gray-50'
                            }
                        `}
                    >
                        <input
                            type="file"
                            multiple
                            onChange={handleFileSelect}
                            className="hidden"
                            id="file-upload"
                            accept={acceptedTypes.join(',')}
                        />
                        <label htmlFor="file-upload" className="cursor-pointer">
                            <svg
                                className="mx-auto h-12 w-12 text-gray-400 mb-4"
                                stroke="currentColor"
                                fill="none"
                                viewBox="0 0 48 48"
                            >
                                <path
                                    d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                                    strokeWidth={2}
                                    strokeLinecap="round"
                                    strokeLinejoin="round"
                                />
                            </svg>
                            {isDragActive ? (
                                <p className="text-lg text-blue-600 font-medium">Drop the files here...</p>
                            ) : (
                                <div>
                                    <p className="text-lg text-gray-600 font-medium mb-2">
                                        Drag & drop documents here, or click to select files
                                    </p>
                                    <p className="text-sm text-gray-500">
                                        Supports: {acceptedTypes.join(', ')} • Max {maxFiles} files • {formatFileSize(maxSize)} per file
                                    </p>
                                </div>
                            )}
                        </label>
                    </div>

                    {/* Upload Progress */}
                    {uploadedFiles.length > 0 && (
                        <div className="card p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">
                                Upload Progress ({uploadedFiles.length} files)
                            </h3>
                            <div className="space-y-3">
                                {uploadedFiles.map((file) => (
                                    <div key={file.id} className="flex items-center space-x-4 p-3 bg-gray-50 rounded-lg">
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center justify-between mb-1">
                                                <p className="text-sm font-medium text-gray-900 truncate">
                                                    {file.name}
                                                </p>
                                                <div className="flex items-center space-x-2">
                                                    <span className="text-xs text-gray-500">
                                                        {formatFileSize(file.size)}
                                                    </span>
                                                    {file.status === 'completed' && (
                                                        <svg className="w-4 h-4 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                                                        </svg>
                                                    )}
                                                    {file.status === 'error' && (
                                                        <svg className="w-4 h-4 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                                                        </svg>
                                                    )}
                                                    <button
                                                        onClick={() => removeFile(file.id)}
                                                        className="text-gray-400 hover:text-gray-600"
                                                    >
                                                        <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </div>
                                            {file.status === 'uploading' && (
                                                <div className="w-full bg-gray-200 rounded-full h-1.5">
                                                    <div
                                                        className="bg-blue-600 h-1.5 rounded-full transition-all duration-300"
                                                        style={{ width: `${file.progress}%` }}
                                                    />
                                                </div>
                                            )}
                                            {file.status === 'error' && file.error && (
                                                <p className="text-xs text-red-600 mt-1">{file.error}</p>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center py-4">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">Document Upload</h1>
                                    <p className="text-sm text-gray-600 mt-1">Upload documents for ingestion into the RAG system</p>
                                </div>
                                <a href="/web/index.html" className="btn-outline">
                                    ← Back to Dashboard
                                </a>
                            </div>
                        </div>
                    </header>

                    <main className="py-8">
                        <DocumentUpload
                            maxFiles={20}
                            maxSize={50 * 1024 * 1024} // 50MB
                            acceptedTypes={['.pdf', '.docx', '.txt', '.md', '.html', '.json']}
                        />
                    </main>
                </div>
            );
        }

        // Mount the React app
        const container = document.getElementById('upload-root');
        const root = createRoot(container);
        root.render(<App />);
    </script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
