<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server Interface - OpenDiscourse</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f8fafc;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                    },
                },
            },
        }
    </script>
</head>
<body>
    <div id="mcp-root"></div>

    <script type="text/babel">
        const { useState, useCallback, useEffect } = React;
        const { createRoot } = ReactDOM;

        function MCPInterface() {
            const [prompt, setPrompt] = useState('');
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('submit');

            // Status polling interval
            const [pollingInterval, setPollingInterval] = useState(null);

            const submitWorkload = useCallback(async () => {
                if (!prompt.trim()) return;

                setLoading(true);
                setError(null);

                try {
                    // Call backend API to submit workload
                    const response = await fetch('/v1/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            prompt: prompt,
                            model: 'llama2',
                            max_tokens: 1000
                        })
                    });

                    if (response.ok) {
                        const result = await response.json();
                        
                        // Add task to tracking list
                        const newTask = {
                            id: Date.now().toString(),
                            prompt: prompt,
                            status: 'completed',
                            result: result.choices?.[0]?.text || result.content || 'No response',
                            timestamp: new Date().toISOString(),
                            model: 'llama2'
                        };

                        setTasks(prev => [newTask, ...prev]);
                        setPrompt('');
                    } else {
                        throw new Error('Failed to submit workload');
                    }
                } catch (err) {
                    setError('Failed to submit workload: ' + err.message);
                } finally {
                    setLoading(false);
                }
            }, [prompt]);

            const deleteTask = useCallback((taskId) => {
                setTasks(prev => prev.filter(task => task.id !== taskId));
            }, []);

            const clearAllTasks = useCallback(() => {
                setTasks([]);
            }, []);

            // Mock data for demonstration if no backend
            const addMockTask = useCallback(() => {
                const mockTask = {
                    id: Date.now().toString(),
                    prompt: 'Sample prompt for testing',
                    status: 'completed',
                    result: 'This is a mock response from the LLM agent.',
                    timestamp: new Date().toISOString(),
                    model: 'ollama/llama2'
                };
                setTasks(prev => [mockTask, ...prev]);
            }, []);

            const getStatusColor = (status) => {
                switch (status) {
                    case 'pending': return 'bg-yellow-100 text-yellow-800';
                    case 'processing': return 'bg-blue-100 text-blue-800';
                    case 'completed': return 'bg-green-100 text-green-800';
                    case 'failed': return 'bg-red-100 text-red-800';
                    default: return 'bg-gray-100 text-gray-800';
                }
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center py-4">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">MCP Server Interface</h1>
                                    <p className="text-sm text-gray-600 mt-1">Submit workloads and track results from LLM agents</p>
                                </div>
                                <a href="/web/index.html" className="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">
                                    ← Back to Dashboard
                                </a>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
                        <div className="space-y-6">
                            {/* Tab Navigation */}
                            <div className="bg-white rounded-lg border border-gray-200">
                                <div className="border-b border-gray-200">
                                    <nav className="-mb-px flex">
                                        <button
                                            onClick={() => setActiveTab('submit')}
                                            className={`py-2 px-4 border-b-2 font-medium text-sm ${
                                                activeTab === 'submit' 
                                                    ? 'border-blue-500 text-blue-600' 
                                                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }`}
                                        >
                                            Submit Workload
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('tasks')}
                                            className={`py-2 px-4 border-b-2 font-medium text-sm ${
                                                activeTab === 'tasks' 
                                                    ? 'border-blue-500 text-blue-600' 
                                                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }`}
                                        >
                                            Task History ({tasks.length})
                                        </button>
                                    </nav>
                                </div>

                                {/* Submit Tab */}
                                {activeTab === 'submit' && (
                                    <div className="p-6">
                                        <div className="space-y-4">
                                            <div>
                                                <label htmlFor="prompt" className="block text-sm font-medium text-gray-700 mb-2">
                                                    Prompt
                                                </label>
                                                <textarea
                                                    id="prompt"
                                                    value={prompt}
                                                    onChange={(e) => setPrompt(e.target.value)}
                                                    placeholder="Enter your prompt for the LLM agent..."
                                                    rows={6}
                                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                                />
                                            </div>

                                            <div className="flex items-center space-x-4">
                                                <button
                                                    onClick={submitWorkload}
                                                    disabled={loading || !prompt.trim()}
                                                    className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
                                                >
                                                    {loading ? 'Submitting...' : 'Submit Workload'}
                                                </button>

                                                <button
                                                    onClick={addMockTask}
                                                    className="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50"
                                                >
                                                    Add Mock Task
                                                </button>
                                            </div>

                                            {error && (
                                                <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                                                    <div className="flex items-center space-x-2">
                                                        <svg className="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                                                        </svg>
                                                        <span className="text-red-700">{error}</span>
                                                    </div>
                                                </div>
                                            )}

                                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                                <h3 className="text-sm font-medium text-blue-900 mb-2">Example Prompts</h3>
                                                <div className="space-y-2">
                                                    <button
                                                        onClick={() => setPrompt('Summarize the key provisions of the Infrastructure Investment and Jobs Act')}
                                                        className="block text-left text-sm text-blue-700 hover:text-blue-900"
                                                    >
                                                        • Summarize the key provisions of the Infrastructure Investment and Jobs Act
                                                    </button>
                                                    <button
                                                        onClick={() => setPrompt('Explain the differences between the House and Senate versions of the Build Back Better Act')}
                                                        className="block text-left text-sm text-blue-700 hover:text-blue-900"
                                                    >
                                                        • Explain the differences between the House and Senate versions of the Build Back Better Act
                                                    </button>
                                                    <button
                                                        onClick={() => setPrompt('What are the main climate provisions in recent federal legislation?')}
                                                        className="block text-left text-sm text-blue-700 hover:text-blue-900"
                                                    >
                                                        • What are the main climate provisions in recent federal legislation?
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Tasks Tab */}
                                {activeTab === 'tasks' && (
                                    <div className="p-6">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-lg font-semibold text-gray-900">Task History</h3>
                                            {tasks.length > 0 && (
                                                <button
                                                    onClick={clearAllTasks}
                                                    className="px-3 py-1 text-sm text-red-600 border border-red-300 rounded hover:bg-red-50"
                                                >
                                                    Clear All
                                                </button>
                                            )}
                                        </div>

                                        {tasks.length === 0 ? (
                                            <div className="text-center py-8">
                                                <svg className="mx-auto w-12 h-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                                </svg>
                                                <h3 className="text-lg font-semibold text-gray-900 mb-2">No tasks yet</h3>
                                                <p className="text-gray-600">Submit a workload to see tasks here</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                {tasks.map((task) => (
                                                    <div key={task.id} className="border border-gray-200 rounded-lg p-4">
                                                        <div className="flex items-start justify-between mb-3">
                                                            <div className="flex items-center space-x-2">
                                                                <span className={`px-2 py-1 text-xs font-medium rounded-full ${getStatusColor(task.status)}`}>
                                                                    {task.status}
                                                                </span>
                                                                <span className="text-xs text-gray-500">
                                                                    {new Date(task.timestamp).toLocaleString()}
                                                                </span>
                                                                <span className="text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded">
                                                                    {task.model}
                                                                </span>
                                                            </div>
                                                            <button
                                                                onClick={() => deleteTask(task.id)}
                                                                className="text-gray-400 hover:text-red-600"
                                                            >
                                                                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                                                    <path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd" />
                                                                </svg>
                                                            </button>
                                                        </div>

                                                        <div className="space-y-3">
                                                            <div>
                                                                <h4 className="text-sm font-medium text-gray-900 mb-1">Prompt:</h4>
                                                                <p className="text-sm text-gray-700 bg-gray-50 p-2 rounded">
                                                                    {task.prompt}
                                                                </p>
                                                            </div>

                                                            {task.result && (
                                                                <div>
                                                                    <h4 className="text-sm font-medium text-gray-900 mb-1">Result:</h4>
                                                                    <div className="text-sm text-gray-700 bg-green-50 p-3 rounded border border-green-200">
                                                                        {task.result}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        // Mount the React app
        const container = document.getElementById('mcp-root');
        const root = createRoot(container);
        root.render(<MCPInterface />);
    </script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
