[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "congress-cli"
version = "1.0.0"
description = "CLI tool for bulk data ingestion from Congress.gov"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "OpenDiscourse Team", email = "team@opendiscourse.org"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pydantic>=1.10.0",
    "requests>=2.28.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=0.19.0",
    "rich>=12.0.0",
    "tqdm>=4.64.0",
    "sqlalchemy>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "pre-commit>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/opendiscourse/congress-cli"
Documentation = "https://congress-cli.readthedocs.io/"
Repository = "https://github.com/opendiscourse/congress-cli.git"
"Bug Tracker" = "https://github.com/opendiscourse/congress-cli/issues"

[project.scripts]
congress-cli = "congress_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
congress_cli = ["migrations/*.sql", "config/*.toml"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=congress_cli --cov-report=html --cov-report=term-missing"
