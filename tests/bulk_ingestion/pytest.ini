ests/bulk_ingestion/pytest.ini</path>
<content">[pytest]
# Pytest configuration for bulk ingestion tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database and APIs)
    database: Tests requiring database access
    network: Tests requiring network access (may be slow)
    performance: Performance and benchmarking tests
    troubleshooting: Diagnostic and troubleshooting tests
    slow: Slow tests (may take longer than 5 seconds)
    end_to_end: End-to-end workflow tests

# Output configuration
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10

# Filtering
# Skip slow tests by default unless explicitly requested

# Minimum version
minversion = 6.0

# Timeout settings
timeout = 300
timeout_method = thread

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test execution settings
maxfail = 5  # Stop after 5 failures
cache_dir = .pytest_cache

# Parallel execution (if pytest-xdist is available)
# addopts = -n auto

# Environment variables for tests
env =
    PYTHONPATH = .
    TESTING = true
    DB_NAME = opendiscourse
    DB_USER = cbwinslow
    DB_HOST = /var/run/postgresql
    SKIP_NETWORK_TESTS = false
    SKIP_INTEGRATION_TESTS = false
