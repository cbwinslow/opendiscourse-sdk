<content"># GitHub Actions workflow for bulk ingestion tests
name: Bulk Ingestion Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/**'
      - 'tests/bulk_ingestion/**'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'tests/bulk_ingestion/**'
      - 'requirements.txt'
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.9'
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: opendiscourse
  DB_USER: postgres
  DB_PASSWORD: postgres

jobs:
  # Unit tests - Fast and no external dependencies
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'tests/bulk_ingestion/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/bulk_ingestion/requirements-test.txt
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        cd tests/bulk_ingestion
        pytest -m "unit and not slow" --tb=short --junit-xml=reports/junit-unit.xml --cov=../../scripts --cov-report=xml:reports/coverage-unit.xml --cov-fail-under=80

    - name: Upload unit test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results
        path: tests/bulk_ingestion/reports/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: tests/bulk_ingestion/reports/coverage-unit.xml
        flags: unit-tests
        name: codecov-unit

  # Integration tests - Require database
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opendiscourse
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-integration-${{ hashFiles('requirements.txt', 'tests/bulk_ingestion/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-integration-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/bulk_ingestion/requirements-test.txt
        pip install -r requirements.txt

    - name: Wait for PostgreSQL
      run: |
        timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'

    - name: Setup database
      run: |
        psql -h localhost -U postgres -c "CREATE DATABASE opendiscourse;" || true
        psql -h localhost -U postgres -d opendiscourse -c "CREATE SCHEMA IF NOT EXISTS congress;" || true
        psql -h localhost -U postgres -d opendiscourse -c "CREATE SCHEMA IF NOT EXISTS incremental;" || true

    - name: Run integration tests
      env:
        DB_HOST: localhost
        DB_NAME: opendiscourse
        DB_USER: postgres
        DB_PASSWORD: postgres
        SKIP_NETWORK_TESTS: true
      run: |
        cd tests/bulk_ingestion
        pytest -m "integration and not slow and not network" --tb=short --junit-xml=reports/junit-integration.xml

    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: tests/bulk_ingestion/reports/

  # Performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opendiscourse
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/bulk_ingestion/requirements-test.txt
        pip install -r requirements.txt

    - name: Wait for PostgreSQL
      run: |
        timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'

    - name: Setup database
      run: |
        psql -h localhost -U postgres -c "CREATE DATABASE opendiscourse;" || true
        psql -h localhost -U postgres -d opendiscourse -c "CREATE SCHEMA IF NOT EXISTS congress;" || true
        psql -h localhost -U postgres -d opendiscourse -c "CREATE SCHEMA IF NOT EXISTS incremental;" || true

    - name: Run performance tests
      env:
        DB_HOST: localhost
        DB_NAME: opendiscourse
        DB_USER: postgres
        DB_PASSWORD: postgres
      run: |
        cd tests/bulk_ingestion
        pytest -m "performance" --tb=short --junit-xml=reports/junit-performance.xml --durations=0

    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: tests/bulk_ingestion/reports/

  # Code quality checks
  quality-checks:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy

    - name: Check code formatting with Black
      run: |
        black --check tests/bulk_ingestion/

    - name: Lint with flake8
      run: |
        flake8 tests/bulk_ingestion/ --max-line-length=88 --extend-ignore=E203,W503

    - name: Type check with mypy
      run: |
        mypy tests/bulk_ingestion/ --ignore-missing-imports

  # Test summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, quality-checks]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Display test summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check unit tests
        if [ -f unit-test-results/reports/junit-unit.xml ]; then
          echo "### Unit Tests ✅" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests completed successfully." >> $GITHUB_STEP_SUMMARY
        else
          echo "### Unit Tests ❌" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests failed or were not completed." >> $GITHUB_STEP_SUMMARY
        fi

        # Check integration tests
        if [ -f integration-test-results/reports/junit-integration.xml ]; then
          echo "### Integration Tests ✅" >> $GITHUB_STEP_SUMMARY
          echo "Integration tests completed successfully." >> $GITHUB_STEP_SUMMARY
        else
          echo "### Integration Tests ❌" >> $GITHUB_STEP_SUMMARY
          echo "Integration tests failed or were not completed." >> $GITHUB_STEP_SUMMARY
        fi

        # Check performance tests
        if [ -f performance-test-results/reports/junit-performance.xml ]; then
          echo "### Performance Tests ✅" >> $GITHUB_STEP_SUMMARY
          echo "Performance tests completed successfully." >> $GITHUB_STEP_SUMMARY
        else
          echo "### Performance Tests ⚠️" >> $GITHUB_STEP_SUMMARY
          echo "Performance tests were not run or completed." >> $GITHUB_STEP_SUMMARY
        fi

        # Check code quality
        echo "### Code Quality ✅" >> $GITHUB_STEP_SUMMARY
        echo "Code quality checks passed." >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All artifacts are available for download." >> $GITHUB_STEP_SUMMARY
