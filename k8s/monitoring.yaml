apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vector-store-monitor
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: vector-store-api
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vector-store-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: vector-store
    rules:
    - alert: HighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High latency in vector store operations
        description: 95th percentile latency is above 1 second for the last 5 minutes

    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High error rate in vector store operations
        description: Error rate is above 5% for the last 5 minutes

    - alert: LowHealthScore
      expr: vector_store_health_score < 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Low health score in vector store
        description: Vector store health score is below 80% for the last 5 minutes

